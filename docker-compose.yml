services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pipeflow-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - pipeflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pipeflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pipeflow-net

networks:
  pipeflow-net:
    driver: bridge

